name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A suíte roda contra Postgres de verdade (o schema é SQL à mão e usa
    # jsonb, FOR UPDATE SKIP LOCKED e índices parciais — um banco em memória
    # não exerceria nada disso). O conftest cria e derruba `visionyard_test`,
    # então o serviço só precisa aceitar postgres/postgres em localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy

      - name: Testes (pytest)
        run: python -m pytest
