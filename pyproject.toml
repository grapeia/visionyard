# Ferramental do repositório. Não descreve um pacote instalável: a API roda a
# partir da raiz (`uvicorn api.main:app`) e o agente é copiado para a máquina de
# execução. Aqui ficam só as configurações de lint, tipo e teste.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "tmp", "agent-work", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    # `async with db.connection() as conn:` + `conn.transaction()` aninhados são
    # o idioma do repositório: a transação numa linha própria deixa visível onde
    # ela começa e termina.
    "SIM117",
    # try/except/pass costuma vir acompanhado do comentário que explica por que
    # o erro é engolido; contextlib.suppress esconderia essa explicação.
    "SIM105",
    # Texto em português usa travessão e ×; não são descuido de digitação.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# conftest fixa o DSN em variável de ambiente antes de importar `api`, porque as
# settings são lidas no import — os imports não têm como subir para o topo.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# `contracts` e `agent` entraram com o item 13 do PLANO: o payload de job é a
# borda que atravessa máquina e deploy, e o contrato só vale se o lado que o LÊ
# também for conferido — um `p.weights_url` no executor tem de reprovar aqui, e
# não horas depois num dispositivo.
files = ["api", "db", "contracts", "agent"]
# Permissivo de propósito no começo: o objetivo imediato é travar recaída de
# tipo em quem já está anotado (ver PLANO, item 2), não anotar o mundo.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# `index` e `dict-item` ficaram desligados até o item 9 do PLANO: `db.fetch_one`
# devolve `dict | None` e o código indexava o resultado direto em 55 lugares.
# Agora ligados — é o mypy que impede a recaída. Query que sempre devolve linha
# usa `db.fetch_row`; onde a linha pode faltar, o certo é `fetch_one` + 404.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
